# Apache2 vhost for infinetmail.services
# Deploy to: /etc/apache2/sites-available/infinetmail.services.conf
# Then: sudo a2ensite infinetmail.services && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName infinetmail.services
    ServerAlias www.infinetmail.services

    DocumentRoot /var/www/infinetmail.services/landing

    <Directory /var/www/infinetmail.services/landing>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/infinetmail.services_error.log
    CustomLog ${APACHE_LOG_DIR}/infinetmail.services_access.log combined
</VirtualHost>

